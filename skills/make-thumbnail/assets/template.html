<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family:"Inter"; src:url("fonts/Inter-700-latin.woff2") format("woff2"); font-weight:700; font-display:block; }
      @font-face { font-family:"Inter"; src:url("fonts/Inter-400-latin.woff2") format("woff2"); font-weight:400; font-display:block; }
      * { box-sizing:border-box; margin:0; padding:0; }
      html, body { width:1280px; height:720px; overflow:hidden; background:#0a0c10; font-family:"Inter",sans-serif; }
      #stage { position:relative; width:1280px; height:720px; overflow:hidden;
        background:radial-gradient(circle at 30% 45%, #14181f, #07090c 80%); }

      /* real photo, right side */
      .photo-wrap { position:absolute; left:42%; top:0; width:58%; height:100%; overflow:hidden; }
      .photo-wrap img { width:100%; height:100%; object-fit:cover; object-position:center top; }
      /* melt the photo's left edge into the dark canvas (no hard seam) */
      .photo-fade { position:absolute; left:40%; top:0; width:16%; height:100%; z-index:2;
        background:linear-gradient(to right, #0a0c10 12%, rgba(10,12,16,0)); }

      /* faint accent glow, lower right */
      .glow { position:absolute; right:0; bottom:0; width:55%; height:75%; z-index:1;
        background:radial-gradient(circle at 75% 70%, rgba(196,30,30,0.20), transparent 60%); }

      /* headline, left third */
      .headline { position:absolute; left:64px; top:50%; transform:translateY(-50%); z-index:3;
        width:600px; color:#fff; font-weight:700; font-size:__FONTSIZE__px; line-height:1.01;
        letter-spacing:-2.5px; text-shadow:0 4px 22px rgba(0,0,0,0.7), 0 2px 4px rgba(0,0,0,0.9); }
      .headline .line { display:block; }
      .headline .accent { color:__ACCENT__; }
      .underline { margin-top:26px; width:288px; height:14px; border-radius:8px;
        background:linear-gradient(90deg,#ffb000,__ACCENT__); box-shadow:0 6px 24px rgba(255,176,0,0.35); }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="glow"></div>
      <div class="photo-wrap"><img src="__PHOTO__" alt="" /></div>
      <div class="photo-fade"></div>
      <div class="headline">__HEADLINE_HTML__<div class="underline"></div></div>
    </div>
  </body>
</html>
